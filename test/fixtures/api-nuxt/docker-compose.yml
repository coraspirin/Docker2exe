services:
  api:
    build: ./api
    ports:
      - "4100:4100"
    environment:
      REDIS_URL: redis://cache:6379
    depends_on: [cache]
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NUXT_API_BASE: http://api:4100
    depends_on: [api]
  cache:
    image: redis:8.2
